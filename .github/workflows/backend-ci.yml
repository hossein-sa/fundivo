name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-insecure-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

      POSTGRES_DB: fundivo
      POSTGRES_USER: fundivo
      POSTGRES_PASSWORD: ci-test-password-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"

    services:
      db:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: fundivo
          POSTGRES_USER: fundivo
          POSTGRES_PASSWORD: ci-test-password-only

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U fundivo -d fundivo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check code quality
        run: python -m ruff check backend

      - name: Check Django configuration
        run: python backend/manage.py check

      - name: Validate OpenAPI schema
        run: >
          python backend/manage.py spectacular
          --validate --fail-on-warn
          --file /tmp/fundivo-schema.yaml

      - name: Check PostgreSQL connection
        run: >
          python backend/manage.py shell -c
          "from django.db import connection;
          connection.ensure_connection();
          print('PostgreSQL connection successful');
          connection.close()"

      - name: Run tests
        run: python -m pytest -c backend/pytest.ini backend/tests -v